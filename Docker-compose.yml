services:
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow
    ports:
      - "8080:8080"
    command: standalone 
    environment:
      - PYTHONPATH=/opt/airflow
    env_file:
      - .env
    depends_on:
      - dbt
      - pyspark
    networks:
    
      - minha-rede
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - /var/run/docker.sock:/var/run/docker.sock
      

  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    container_name: dbt
    
    environment:
      - DBT_PROFILES_DIR=/app 
    env_file:
      - .env
    networks:
      - minha-rede
    dns:
      - 8.8.8.8
    volumes:
      - ./dbt:/app/dbt

  pyspark:
    build:
      context: .
      dockerfile: Dockerfile.pyspark
    container_name: pyspark_job
    env_file:
      - .env
    networks:
      - minha-rede
    volumes:
      - ./parquet:/app/parquet
      - ./modelos:/app/modelos


networks:
  minha-rede:
    name: minha-rede
    driver: bridge