version: 2

models:
  - name: dados_csv_silver
    description: "Tabela para o processamento do kmeans."
    columns:
      - name: id           
        description: "Chave primária do registro."
        tests:
          - unique         
          - not_null                     
  - name: dados_ibge_silver
    description: "tabela para o calculo de impacto populacional."
    columns:
      - name: populacao
        description: "População total da cidade."
        tests:
          - not_null

  - name: gold_dados_kmeans 
    description: "Tabela com os dados padronizados para o kmeans."
    columns:
      - name: id
        description: "Chave primária do registro."
        tests:
          - unique
          - not_null
      - name: mes_sin
        description: "Valor do seno do mês para capturar a sazonalidade."
      - name: mes_cos
        description: "Valor do cosseno do mês para capturar a sazonalidade."
      - name: temp_padronizado
        description: "Temperatura padronizada (z-score) para o kmeans."
      - name: humidity_padronizado
        description: "Umidade padronizada (z-score) para o kmeans."
      - name: pressure_padronizada
        description: "Pressão padronizada (z-score) para o kmeans."
      - name: anomaly_name
        description: "Nome da anomalia associada ao registro, se houver."